name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            target: ''
            args: ''
          - platform: windows-latest
            target: ''
            args: ''
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test

      - name: Run cargo tests
        # fs_test requires Windows WebView2 DLL at runtime — best-effort cross-platform.
        continue-on-error: true
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Build Tauri (release)
        run: pnpm exec tauri build ${{ matrix.args }}

      - name: Upload bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sharkmd-${{ matrix.platform }}
          path: |
            src-tauri/target/**/bundle/
          if-no-files-found: error
          retention-days: 7

      - name: Create / update draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: sharkmd ${{ github.ref_name }}
          body: |
            See [CHANGELOG.md](./CHANGELOG.md) for full release notes.

            ## Downloads
            Choose your platform:
            - **Windows**: `.msi` / `.exe`
            - **macOS**: `.dmg` (universal: Apple Silicon + Intel)
            - **Linux**: `.AppImage` / `.deb`

            ## Verification
            sharkmd v0.3.0 ships **unsigned** for all platforms. On first launch:
            - **macOS**: Right-click → Open → confirm bypass of Gatekeeper
            - **Windows**: "More info" → "Run anyway" to dismiss SmartScreen
            - **Linux**: AppImage `chmod +x sharkmd_*.AppImage && ./sharkmd_*.AppImage`
          draft: true
          prerelease: false
          # softprops@v2 reads artifacts uploaded via actions/upload-artifact and
          # attaches matching files. Glob filters the right files per platform.
          files: |
            src-tauri/target/**/bundle/**/*.msi
            src-tauri/target/**/bundle/**/*.exe
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.AppImage
            src-tauri/target/**/bundle/**/*.deb
          fail_on_unmatched_files: false
