name: Version Check

on:
  pull_request:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: apt-get update && apt-get install -y jq
      - run: bash scripts/check-version.sh
