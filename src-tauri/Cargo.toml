[package]
name = "easymd"
version = "0.1.0"
description = "Markdown editor"
edition = "2021"
rust-version = "1.75"

[lib]
name = "easymd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "fs", "io-util", "macros", "rt"] }
notify = "6"
log = "0.4"
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2"
dirs = "5"
chrono = "0.4"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
