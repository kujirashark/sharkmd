[package]
name = "sharkmd"
version = "0.1.0"
description = "Markdown editor"
edition = "2021"
rust-version = "1.75"

[lib]
name = "sharkmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.10.3", features = [] }
tauri-plugin-log = "=2.9.1"
tauri-plugin-fs = "=2.5.0"
tauri-plugin-dialog = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "fs", "io-util", "macros", "rt"] }
notify = "6"
log = "0.4"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
percent-encoding = "2"
dirs = "6"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

[dev-dependencies]
tauri = { version = "=2.10.3", features = ["test"] }
tempfile = "3"
